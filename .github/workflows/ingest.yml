name: ingest

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One ingest at a time so pushes never race.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: "startsWith(github.event.issue.title, 'run: ')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and store run
        id: ingest
        run: node scripts/ingest.mjs

      - name: Commit accepted run
        if: steps.ingest.outputs.status == 'ok'
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "run-ingest[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/runs
          git commit -m "data: add run #$NUM"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep $((i * 3))
          done

      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          STATUS: ${{ steps.ingest.outputs.status }}
          REASON: ${{ steps.ingest.outputs.reason }}
        run: |
          if [ "$STATUS" = "ok" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Thanks, run recorded."
          else
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "Rejected: $REASON"
          fi