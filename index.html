<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub-only login spike</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; box-sizing: border-box; }
  button { margin: .5rem .5rem 0 0; padding: .6rem 1rem; }
  pre { background: #111; color: #0f0; padding: 1rem; overflow: auto; white-space: pre-wrap; min-height: 8rem; }
</style>
</head>
<body>
<h1>GitHub-only login spike</h1>
<p>Tests three things: (1) can the browser call GitHub's device-flow endpoint (CORS), (2) can it get a token, (3) can it create an issue with that token.</p>

<label>Client ID (from your GitHub App or OAuth App, device flow enabled)</label>
<input id="cid" placeholder="Iv1.xxxxxxxxxxxxxxxx">
<label>Repo for test issue (owner/name)</label>
<input id="repo" placeholder="you/boss-game">
<label>Scope (OAuth App only; leave blank for a GitHub App)</label>
<input id="scope" placeholder="public_repo">

<button id="step1">1. Start device flow</button>
<button id="step3" disabled>3. Create test issue</button>

<pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);
const log = (...a) => { $('log').textContent += a.join(' ') + '\n'; };
let token = null;

const form = o => new URLSearchParams(o).toString();

$('step1').onclick = async () => {
  $('log').textContent = '';
  const client_id = $('cid').value.trim();
  if (!client_id) return log('Enter a client ID first.');
  try {
    log('POST https://github.com/login/device/code ...');
    const r = await fetch('https://github.com/login/device/code', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' },
      body: form({ client_id, scope: $('scope').value.trim() })
    });
    const d = await r.json();
    log('OK, CORS works for device/code:', JSON.stringify(d));
    if (!d.user_code) return log('No user_code returned; check client ID / device flow enabled.');
    log(`\nGo to ${d.verification_uri} and enter code: ${d.user_code}\nWaiting for you to approve...`);
    window.open(d.verification_uri, '_blank');
    poll(client_id, d.device_code, (d.interval || 5) + 1, d.expires_in || 900);
  } catch (e) {
    log('FAILED:', e.message);
    log('A "Failed to fetch" / CORS error here means the browser cannot call device flow directly.');
    log('Fallback: a tiny relay for just this handshake.');
  }
};

async function poll(client_id, device_code, interval, expires) {
  const end = Date.now() + expires * 1000;
  while (Date.now() < end) {
    await new Promise(r => setTimeout(r, interval * 1000));
    try {
      const r = await fetch('https://github.com/login/oauth/access_token', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form({ client_id, device_code, grant_type: 'urn:ietf:params:oauth:grant-type:device_code' })
      });
      const d = await r.json();
      if (d.access_token) {
        token = d.access_token;
        log('\nGot a token (CORS works for access_token too). Not shown for safety.');
        $('step3').disabled = false;
        return;
      }
      if (d.error === 'authorization_pending') continue;
      if (d.error === 'slow_down') { interval += 5; continue; }
      return log('Stopped:', JSON.stringify(d));
    } catch (e) {
      return log('Polling FAILED:', e.message, '(likely CORS on access_token)');
    }
  }
  log('Timed out.');
}

$('step3').onclick = async () => {
  const repo = $('repo').value.trim();
  if (!repo) return log('Enter owner/name first.');
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/issues`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({ title: 'spike: test run upload', body: JSON.stringify({ test: true, t: Date.now() }) })
    });
    const d = await r.json();
    log(r.ok ? `Issue created: ${d.html_url}` : `API error ${r.status}: ${JSON.stringify(d)}`);
  } catch (e) {
    log('Issue creation FAILED:', e.message);
  }
};
</script>
</body>
</html>
