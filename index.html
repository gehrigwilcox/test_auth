<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prefilled-issue upload test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; box-sizing: border-box; }
  button { margin: .75rem .5rem 0 0; padding: .6rem 1rem; }
  pre { background: #111; color: #0f0; padding: 1rem; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Prefilled-issue upload test</h1>
<p>Simulates a fight log, compresses it, and opens a prefilled GitHub issue. Tells you how big a run can be before the link breaks.</p>

<label>Repo (owner/name)</label>
<input id="repo" placeholder="you/boss-game">
<label>Fight length (seconds)</label>
<input id="secs" type="number" value="120">
<label>Samples per second</label>
<input id="hz" type="number" value="5">

<button id="go">Build link and open issue form</button>
<pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);
const log = (...a) => { $('log').textContent += a.join(' ') + '\n'; };

// Fake but realistic-ish log: quantized bytes, so it compresses like a real one would.
// Each tick: [playerX, playerY, bossX, bossY, bossAimAngle, bossActionBits, playerActionBits]
function fakeRun(secs, hz) {
  const n = secs * hz;
  let px = 128, py = 128, bx = 40, by = 40, a = 0;
  const ticks = [];
  for (let i = 0; i < n; i++) {
    px = Math.max(0, Math.min(255, px + Math.round((Math.random() - .5) * 20)));
    py = Math.max(0, Math.min(255, py + Math.round((Math.random() - .5) * 20)));
    bx += Math.sign(px - bx) * 3; by += Math.sign(py - by) * 3;
    a = (a + Math.round((Math.random() - .3) * 16) + 256) % 256;
    ticks.push([px, py, bx & 255, by & 255, a, Math.random() < .2 ? 1 : 0, Math.random() < .1 ? 1 : 0]);
  }
  return { v: 1, hz, outcome: 'player_won', ticks };
}

async function gzipB64url(str) {
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = '';
  for (const b of buf) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

$('go').onclick = async () => {
  $('log').textContent = '';
  const repo = $('repo').value.trim();
  if (!repo) return log('Enter a repo first.');
  const run = fakeRun(+$('secs').value, +$('hz').value);
  const json = JSON.stringify(run);
  const payload = await gzipB64url(json);
  const body = '```run\n' + payload + '\n```';
  const url = `https://github.com/${repo}/issues/new?title=${encodeURIComponent('run: ' + Date.now())}&body=${encodeURIComponent(body)}`;
  log('raw JSON bytes:   ', json.length);
  log('gzip+base64 chars:', payload.length);
  log('full URL length:  ', url.length);
  if (url.length > 7500) log('WARNING: over ~7500 chars. Likely to fail. Lower the sample rate or length.');
  else log('Looks OK. Opening the issue form...');
  window.open(url, '_blank');
};
</script>
</body>
</html>
